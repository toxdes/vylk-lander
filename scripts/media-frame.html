<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Vylk recording frame</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff}
body{background:radial-gradient(ellipse at 88% 100%,#ffd4b2 0,transparent 52%),radial-gradient(ellipse at 77% 10%,#b2a6e6 0,transparent 48%),linear-gradient(132deg,#17254e 0%,#51439c 35%,#ad609d 66%,#e89a9a 100%)}
body:before{content:"";position:absolute;width:2150px;height:1380px;left:-780px;top:390px;border-radius:50%;transform:rotate(-30deg);background:linear-gradient(125deg,#0c234fbb,#473c9f77 65%,#c477b333);box-shadow:70px -30px 150px #a68bdf55}

.window{position:absolute;overflow:hidden;border-radius:12px;background:#1a1c30;box-shadow:0 30px 85px #15103566,0 7px 24px #17123233;outline:1px solid #ffffff38}
.titlebar{height:38px;background:linear-gradient(#2a2b3b,#242535);position:relative;display:flex;justify-content:center;align-items:center;box-shadow:inset 0 -1px #0004;color:#e7e8f0;font-size:13px;font-weight:600}
.lights{position:absolute;left:15px;display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 1px #0002}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.single .window{left:180px;top:52px;width:1560px}.dual .window{left:80px;top:72px;width:1248px}
.phone{display:none;position:absolute;left:1438px;top:72px;width:403.31px;height:904.67px;padding:9px;border-radius:43px;background:linear-gradient(115deg,#42434e,#101014 40%,#2f3038);box-shadow:0 27px 70px #1e143e66,0 5px 16px #15112244;outline:1px solid #ffffff66}
.dual .phone{display:block}.phone-screen{overflow:hidden;border-radius:34px;background:#0d1020}.status{height:32px;background:#1b1d31;display:flex;align-items:center;justify-content:space-between;padding:0 19px;font-size:11px;font-weight:600;position:relative}.status svg{width:44px;height:13px;fill:none;stroke:#eee;stroke-width:1.4}.home{height:20px;background:#0d1020;display:grid;place-items:center}.home:after{content:"";width:110px;height:4px;border-radius:5px;background:#e5e6ec}
.dock{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);height:72px;padding:9px 12px;display:flex;align-items:center;gap:15px;border-radius:19px;background:linear-gradient(#ffffff45,#ffffff28);box-shadow:inset 0 0 0 1px #ffffff55,0 12px 40px #24204738;backdrop-filter:blur(24px)}.dock svg,.dock img{display:block;width:48px;height:48px;border-radius:11px;filter:drop-shadow(0 2px 2px #1a193133)}.dock .app{position:relative}.dock .app:after{content:"";position:absolute;width:4px;height:4px;background:#302c4d;border-radius:50%;bottom:-7px;left:22px}.dock .divider{height:43px;width:1px;background:#ffffff55;margin:0 1px}

.dual .phone-screen{height:100%;display:flex;flex-direction:column}
.dual .status{flex:0 0 32px}

.dual .home{flex:0 0 20px}

.single #desktop{aspect-ratio:16/9}
.dual #desktop{aspect-ratio:1440/1000}
.dual #phone{flex:1;min-height:0}
.video-slot{background:#1a1c30}
</style>
<body class="single">

<div class="window"><div class="titlebar"><div class="lights"><i></i><i></i><i></i></div>Vylk</div><div id="desktop" class="video-slot"></div></div>
<div class="phone"><div class="phone-screen"><div class="status"><span>10:24</span><svg viewBox="0 0 44 13"><path d="M1 10V8M5 10V6M9 10V3M13 10V1M19 4q5-4 10 0M22 7q2-2 4 0"/><rect x="32" y="2" width="10" height="8" rx="2"/><path d="M43 4v4M34 4h6v4h-6Z"/></svg></div><div id="phone" class="video-slot"></div><div class="home"></div></div></div>
<div class="dock"><svg viewBox="0 0 48 48" aria-label="Finder"><defs><linearGradient id="f" x2="0" y2="1"><stop stop-color="#39b7ff"/><stop offset="1" stop-color="#0786eb"/></linearGradient></defs><rect width="48" height="48" rx="11" fill="url(#f)"/><path d="M26 0h11q11 0 11 11v26q0 11-11 11H25l-4-17 6-1-2-11Z" fill="#dceeff"/><path d="M13 16v5M35 16v5M11 31q13 11 26 0M25 8l-3 19h7v12" stroke="#163d60" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="app"><img src="../assets/vylk-logo.webp" alt="Vylk in the Dock"></div><div class="divider"></div><svg viewBox="0 0 48 48" aria-label="Trash"><defs><linearGradient id="t" x2="1" y2="0"><stop stop-color="#b8c1cd"/><stop offset=".5" stop-color="#f5f7fa"/><stop offset="1" stop-color="#bcc4ce"/></linearGradient></defs><path d="M10 12h28l-3 30q-11 5-22 0Z" fill="url(#t)" stroke="#858d9c"/><ellipse cx="24" cy="12" rx="14" ry="4" fill="#e8edf3" stroke="#969eab"/><ellipse cx="24" cy="12" rx="11" ry="2" fill="#778493"/><path d="m18 20 1 18m5-18v19m6-19-1 18" stroke="#9aa5b2" stroke-width="1.4"/></svg></div>
<script>if(location.hash==='#dual'){document.body.className='dual';}</script>
</body></html>
